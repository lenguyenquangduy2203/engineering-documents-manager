[package]
name = "engineering-documents-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
axum = "0.8.9"
axum-macros = "0.5.1"
chrono = "0.4.45"
dotenvy = "0.15.7"
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = {version = "0.9.0", features = ["sqlite", "runtime-tokio", "macros"]}
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.19"
tokio = {version = "1.53.1", features = ["full"]}
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23", features = ["env-filter"]}

[[test]]
name = "component_repository_test"
path = "tests/core/components/repositories/components_repository_test.rs"

[[test]]
name = "document_lifecycle_manager_test"
path = "tests/core/documents/repositories/document_lifecycle_manager_test.rs"

[[test]]
name = "component_type_resolver_test"
path = "tests/core/components/repositories/component_type_resolver_test.rs"

[[test]]
name = "component_payload_resolver_test"
path = "tests/core/components/repositories/component_payload_resolver_test.rs"
