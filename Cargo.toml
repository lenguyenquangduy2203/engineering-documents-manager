[package]
name = "engineering-documents-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
axum = "0.8.9"
axum-macros = "0.5.1"
dotenvy = "0.15.7"
serde = "1.0.228"
serde_json = "1.0.150"
sqlx = {version = "0.9.0", features = ["sqlite", "runtime-tokio"]}
thiserror = "2.0.18"
tokio = {version = "1.52.3", features = ["full"]}
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23", features = ["env-filter"]}
